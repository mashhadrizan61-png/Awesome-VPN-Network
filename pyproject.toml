[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery-lab"
version = "0.1.0"
description = "Python data recovery orchestrator with large-scale scenario planning"
requires-python = ">=3.10"

[project.scripts]
recovery-lab = "recovery_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
